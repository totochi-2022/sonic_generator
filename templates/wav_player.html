<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV Player - SonicGenerator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .player-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .btn-play-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play-large svg {
            width: 28px;
            height: 28px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 300px;
        }

        .volume-control input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
        }

        .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
        }

        .volume-control input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
        }

        .volume-control input[type="range"]::-moz-range-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .volume-label {
            min-width: 45px;
            text-align: right;
            color: #a0aec0;
        }

        .loop-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loop-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .loop-toggle.active {
            color: #38ef7d;
        }

        .progress-container {
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: #a0aec0;
            font-size: 14px;
            margin-top: 8px;
        }

        .now-playing {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .now-playing.empty {
            color: #a0aec0;
        }

        .file-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .file-item.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .file-item.playing {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .file-icon {
            margin-right: 12px;
            opacity: 0.7;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
        }

        .upload-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            color: #a0aec0;
        }

        .upload-area:hover {
            border-color: #667eea;
        }

        .upload-area.dragover {
            border-color: #38ef7d;
            background: rgba(56, 239, 125, 0.1);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0aec0;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>WAV Player</h1>
        </div>
    </header>

    <div class="container">
        <a href="/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            トップに戻る
        </a>

        <div class="player-container">
            <div class="now-playing empty" id="now-playing">ファイルを選択してください</div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="btn btn-success btn-play-large" id="play-btn" onclick="togglePlay()">
                    <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                </button>

                <button class="btn btn-danger" onclick="stopPlayback()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                    停止
                </button>

                <div class="loop-toggle" id="loop-toggle">
                    <input type="checkbox" id="loop-checkbox" onchange="toggleLoop()">
                    <label for="loop-checkbox">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17 1 21 5 17 9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7 23 3 19 7 15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                        繰り返し
                    </label>
                </div>

                <div class="volume-control">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <input type="range" id="volume-slider" min="0" max="100" value="80" oninput="changeVolume(this.value)">
                    <span class="volume-label" id="volume-label">80%</span>
                </div>
            </div>
        </div>

        <div class="player-container">
            <h3>ファイル一覧</h3>
            <div class="file-list" id="file-list">
                {% if wav_files %}
                    {% for file in wav_files %}
                    <div class="file-item" data-path="{{ file.path }}" data-name="{{ file.name }}" onclick="selectFile(this)">
                        <svg class="file-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                        <span class="file-name">{{ file.name }}</span>
                    </div>
                    {% endfor %}
                {% else %}
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        WAVファイルがありません。<br>
                        プログラムをエクスポートするか、ファイルをアップロードしてください。
                    </div>
                {% endif %}
            </div>

            <div class="upload-section">
                <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 8px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <div>WAVファイルをドラッグ&ドロップ、またはクリックして選択</div>
                </div>
                <input type="file" id="file-input" accept=".wav,audio/wav" style="display: none;" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>

    <script>
        // Audio状態管理
        let audioContext = null;
        let currentSource = null;
        let gainNode = null;
        let audioBuffer = null;
        let isPlaying = false;
        let isLooping = false;
        let startTime = 0;
        let pauseTime = 0;
        let currentFile = null;
        let animationId = null;

        // 初期化
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioContext.createGain();
                gainNode.connect(audioContext.destination);
                gainNode.gain.value = 0.8;
            }
        }

        // ファイル選択
        function selectFile(element) {
            // 選択状態をクリア
            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');

            const path = element.dataset.path;
            const name = element.dataset.name;

            loadAudioFile(path, name);
        }

        // 音声ファイル読み込み
        async function loadAudioFile(url, name) {
            initAudioContext();
            stopPlayback();

            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                currentFile = name;

                document.getElementById('now-playing').textContent = name;
                document.getElementById('now-playing').classList.remove('empty');
                document.getElementById('total-time').textContent = formatTime(audioBuffer.duration);

                // 自動再生
                playAudio();
            } catch (error) {
                alert('ファイルの読み込みに失敗しました: ' + error);
            }
        }

        // 再生
        function playAudio() {
            if (!audioBuffer) return;

            initAudioContext();

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            currentSource = audioContext.createBufferSource();
            currentSource.buffer = audioBuffer;
            currentSource.loop = isLooping;
            currentSource.connect(gainNode);

            currentSource.onended = function() {
                if (!isLooping && isPlaying) {
                    isPlaying = false;
                    pauseTime = 0;
                    updatePlayButton();
                    cancelAnimationFrame(animationId);
                    document.getElementById('progress-fill').style.width = '0%';
                    document.getElementById('current-time').textContent = '0:00';
                }
            };

            startTime = audioContext.currentTime - pauseTime;
            currentSource.start(0, pauseTime);

            isPlaying = true;
            updatePlayButton();
            updateProgress();

            // ファイル一覧の表示更新
            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.remove('playing');
                if (el.dataset.name === currentFile) {
                    el.classList.add('playing');
                }
            });
        }

        // 一時停止
        function pauseAudio() {
            if (currentSource) {
                currentSource.stop();
                currentSource = null;
            }
            pauseTime = audioContext.currentTime - startTime;
            isPlaying = false;
            updatePlayButton();
            cancelAnimationFrame(animationId);

            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.remove('playing');
            });
        }

        // 停止
        function stopPlayback() {
            if (currentSource) {
                currentSource.stop();
                currentSource = null;
            }
            pauseTime = 0;
            isPlaying = false;
            updatePlayButton();
            cancelAnimationFrame(animationId);

            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('current-time').textContent = '0:00';

            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.remove('playing');
            });
        }

        // 再生/一時停止切り替え
        function togglePlay() {
            if (!audioBuffer) {
                alert('ファイルを選択してください');
                return;
            }

            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        // 再生ボタン表示更新
        function updatePlayButton() {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');

            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // プログレス更新
        function updateProgress() {
            if (!isPlaying || !audioBuffer) return;

            const elapsed = audioContext.currentTime - startTime;
            const duration = audioBuffer.duration;

            // ループ時は経過時間をモジュロで計算
            const displayTime = isLooping ? (elapsed % duration) : Math.min(elapsed, duration);
            const progress = (displayTime / duration) * 100;

            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('current-time').textContent = formatTime(displayTime);

            animationId = requestAnimationFrame(updateProgress);
        }

        // シーク
        function seekTo(event) {
            if (!audioBuffer) return;

            const progressBar = document.getElementById('progress-bar');
            const rect = progressBar.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            const seekTime = percent * audioBuffer.duration;

            pauseTime = seekTime;

            if (isPlaying) {
                pauseAudio();
                playAudio();
            } else {
                document.getElementById('progress-fill').style.width = (percent * 100) + '%';
                document.getElementById('current-time').textContent = formatTime(seekTime);
            }
        }

        // ループ切り替え
        function toggleLoop() {
            isLooping = document.getElementById('loop-checkbox').checked;
            const toggle = document.getElementById('loop-toggle');

            if (isLooping) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }

            // 再生中の場合は再起動してループ設定を反映
            if (isPlaying && currentSource) {
                const currentTime = audioContext.currentTime - startTime;
                pauseTime = currentTime % audioBuffer.duration;
                pauseAudio();
                playAudio();
            }
        }

        // 音量変更
        function changeVolume(value) {
            const volume = value / 100;
            if (gainNode) {
                gainNode.gain.value = volume;
            }
            document.getElementById('volume-label').textContent = value + '%';
        }

        // 時間フォーマット
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ファイルアップロード処理
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadLocalFile(file);
            }
        }

        async function loadLocalFile(file) {
            initAudioContext();
            stopPlayback();

            try {
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                currentFile = file.name.replace('.wav', '');

                document.getElementById('now-playing').textContent = currentFile;
                document.getElementById('now-playing').classList.remove('empty');
                document.getElementById('total-time').textContent = formatTime(audioBuffer.duration);

                playAudio();
            } catch (error) {
                alert('ファイルの読み込みに失敗しました: ' + error);
            }
        }

        // ドラッグ&ドロップ
        const uploadArea = document.getElementById('upload-area');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (file && file.name.toLowerCase().endsWith('.wav')) {
                loadLocalFile(file);
            } else {
                alert('WAVファイルのみ対応しています');
            }
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
