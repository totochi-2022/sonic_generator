<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音波洗浄システム</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🔊 音波洗浄システム</h1>
        </div>
    </header>

    <div class="container">
        <!-- 操作ボタン 1段目 -->
        <div class="toolbar mb-10">
            <button class="btn" onclick="editSelected()">
                編集
            </button>
            <button class="btn" onclick="exportSelected()">
                WAVE出力
            </button>
            <button class="btn btn-danger" onclick="deleteSelected()">
                削除
            </button>
            <span class="toolbar-spacer"></span>
            <button class="btn btn-success" onclick="createNewProgram()">
                + 新規作成
            </button>
        </div>

        <!-- 再生コントロール 2段目 -->
        <div class="toolbar mb-20">
            <select id="audio-backend" class="backend-select">
                <option value="webaudio">Web Audio</option>
                <option value="paplay">paplay (Linux)</option>
                <option value="sounddevice">sounddevice</option>
            </select>
            <button class="btn" onclick="prevStage()">
                |&lt; 前
            </button>
            <button class="btn btn-success" onclick="playSelected()">
                再生
            </button>
            <button class="btn btn-danger" onclick="stopPlayback()">
                停止
            </button>
            <button class="btn" onclick="nextStage()">
                次 &gt;|
            </button>
            <span class="toolbar-spacer"></span>
            <span class="playback-info">
                <span id="playback-status">停止中</span>
                <span id="playback-stage">ステージ: -</span>
                <span id="playback-time">0:00 / 0:00</span>
            </span>
        </div>

        <div id="programs-container">
            {% if programs %}
                <div class="program-list">
                    {% for program in programs %}
                    <div class="program-card" onclick="selectProgram('{{ program.id }}', '{{ program.name }}')" data-program-id="{{ program.id }}">
                        <div class="program-select">
                            <input type="radio" name="selected-program" id="program-{{ program.id }}" value="{{ program.id }}" data-name="{{ program.name }}">
                        </div>
                        <div class="program-info">
                            <h3>{{ program.name }}</h3>
                            <p>
                                ステージ数: {{ program.stages|length }} /
                                サンプリングレート: {{ program.sample_rate }} Hz
                            </p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-state">
                    <p>プログラムがまだありません</p>
                    <button class="btn btn-success" onclick="createNewProgram()">
                        + 新規プログラム作成
                    </button>
                </div>
            {% endif %}
        </div>
    </div>

    <script>
        // ===== Web Audio API 関連 =====
        let audioContext = null;
        let currentSource = null;
        let currentGainNode = null;

        function stopWebAudio() {
            if (currentSource) {
                try {
                    currentSource.stop(0);
                    currentSource.disconnect();
                } catch (e) {}
                currentSource = null;
            }
            if (currentGainNode) {
                try {
                    currentGainNode.disconnect();
                } catch (e) {}
                currentGainNode = null;
            }
        }

        // ===== 選択関連 =====
        function selectProgram(programId, programName) {
            // ラジオボタンを選択
            const radio = document.getElementById('program-' + programId);
            if (radio) radio.checked = true;

            // カードのハイライト
            document.querySelectorAll('.program-card').forEach(card => {
                card.classList.remove('selected');
            });
            const card = document.querySelector(`[data-program-id="${programId}"]`);
            if (card) card.classList.add('selected');
        }

        function getSelectedProgram() {
            const selected = document.querySelector('input[name="selected-program"]:checked');
            if (!selected) {
                alert('プログラムを選択してください');
                return null;
            }
            return {
                id: selected.value,
                name: selected.dataset.name
            };
        }

        function editSelected() {
            const program = getSelectedProgram();
            if (program) {
                window.location.href = '/program/' + program.id;
            }
        }

        function playSelected() {
            const program = getSelectedProgram();
            if (!program) return;

            const backend = document.getElementById('audio-backend').value;

            if (backend === 'webaudio') {
                // Web Audio APIで再生
                playWithWebAudio(program.id);
            } else {
                // サーバーサイドで再生
                fetch(`/api/play/${program.id}?backend=${backend}`, {
                    method: 'POST'
                })
                .catch(error => {
                    alert('再生エラー: ' + error);
                });
            }
        }

        function playWithWebAudio(programId) {
            // 波形データを取得してWeb Audioで再生
            fetch(`/api/waveform/data/program/${programId}`)
                .then(response => response.json())
                .then(data => {
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    stopWebAudio();

                    const audioBuffer = audioContext.createBuffer(1, data.waveform.length, data.sample_rate);
                    const channelData = audioBuffer.getChannelData(0);
                    for (let i = 0; i < data.waveform.length; i++) {
                        channelData[i] = data.waveform[i];
                    }

                    currentSource = audioContext.createBufferSource();
                    currentGainNode = audioContext.createGain();

                    currentSource.buffer = audioBuffer;
                    currentSource.connect(currentGainNode);
                    currentGainNode.connect(audioContext.destination);

                    currentSource.start(0);
                })
                .catch(error => {
                    alert('Web Audio再生エラー: ' + error);
                });
        }

        function exportSelected() {
            const program = getSelectedProgram();
            if (program) {
                const filename = prompt('ファイル名を入力してください:', program.name);
                if (filename === null) return;
                window.location.href = '/api/export/' + program.id + '?filename=' + encodeURIComponent(filename);
            }
        }

        function deleteSelected() {
            const program = getSelectedProgram();
            if (!program) return;
            if (!confirm(`"${program.name}" を削除してもよろしいですか？`)) return;

            fetch('/api/programs/' + program.id, {
                method: 'DELETE'
            })
            .then(() => {
                window.location.reload();
            })
            .catch(error => {
                alert('削除に失敗しました: ' + error);
            });
        }

        function createNewProgram() {
            const name = prompt('プログラム名を入力してください:', '新規プログラム');
            if (!name) return;

            const sampleRateChoice = prompt(
                'サンプリングレートを選択してください:\n' +
                '1: 44100 Hz (CD品質・標準)\n' +
                '2: 48000 Hz (動画/放送品質)\n' +
                '3: 22050 Hz (低品質・軽量)\n' +
                '4: 96000 Hz (ハイレゾ)',
                '1'
            );

            const sampleRates = { '1': 44100, '2': 48000, '3': 22050, '4': 96000 };
            const sampleRate = sampleRates[sampleRateChoice] || 44100;

            fetch('/api/programs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    stages: [],
                    sample_rate: sampleRate
                })
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = '/program/' + data.id;
            })
            .catch(error => {
                alert('エラーが発生しました: ' + error);
            });
        }

        function stopPlayback() {
            stopWebAudio();
            updateStatus('停止中');
            fetch('/api/stop', {
                method: 'POST'
            })
            .catch(error => {
                alert('停止エラー: ' + error);
            });
        }

        function prevStage() {
            fetch('/api/prev', {
                method: 'POST'
            })
            .catch(error => {
                alert('ステージ移動エラー: ' + error);
            });
        }

        function nextStage() {
            fetch('/api/next', {
                method: 'POST'
            })
            .catch(error => {
                alert('ステージ移動エラー: ' + error);
            });
        }

        function updateStatus(text) {
            const status = document.getElementById('playback-status');
            if (status) status.textContent = text;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function pollStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusEl = document.getElementById('playback-status');
                    const stageEl = document.getElementById('playback-stage');
                    const timeEl = document.getElementById('playback-time');

                    statusEl.classList.remove('playing');

                    if (data.is_playing) {
                        statusEl.textContent = '再生中';
                        statusEl.classList.add('playing');
                    } else {
                        statusEl.textContent = '停止中';
                    }

                    stageEl.textContent = `ステージ: ${data.current_stage + 1}`;
                    timeEl.textContent = `${formatTime(data.elapsed_time)} / ${formatTime(data.total_time)}`;
                })
                .catch(() => {});
        }

        // 1秒ごとにステータスを更新
        setInterval(pollStatus, 1000);
        pollStatus();
    </script>
</body>
</html>
