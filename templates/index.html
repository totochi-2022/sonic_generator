<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音波洗浄システム</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>🔊 音波洗浄システム</h1>
        </div>
    </header>

    <div class="container">
        <div class="text-center mb-20">
            <button class="btn btn-success" onclick="createNewProgram()">
                ➕ 新規プログラム作成
            </button>
            <button class="btn btn-danger" onclick="stopPlayback()">
                ⏹️ 再生停止
            </button>
        </div>

        <div id="programs-container">
            {% if programs %}
                <div class="program-list">
                    {% for program in programs %}
                    <div class="program-card">
                        <h3>{{ program.name }}</h3>
                        <p>
                            ステージ数: {{ program.stages|length }}<br>
                            サンプリングレート: {{ program.sample_rate }} Hz
                        </p>
                        <div class="program-actions">
                            <a href="/program/{{ program.id }}" class="btn btn-small">✏️ 編集</a>
                            <button class="btn btn-small btn-success"
                                    onclick="playProgram('{{ program.id }}')">
                                ▶️ 再生
                            </button>
                            <button class="btn btn-small"
                                    onclick="exportProgram('{{ program.id }}', '{{ program.name }}')">
                                💾 エクスポート
                            </button>
                            <button class="btn btn-small btn-danger"
                                    onclick="deleteProgram('{{ program.id }}')">
                                🗑️ 削除
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-state">
                    <p>プログラムがまだありません</p>
                    <button class="btn btn-success" onclick="createNewProgram()">
                        ➕ 新規プログラム作成
                    </button>
                </div>
            {% endif %}
        </div>

        <div id="loading" class="htmx-indicator" style="text-align: center; padding: 20px;">
            <p>処理中...</p>
        </div>
    </div>

    <script>
        // ===== Web Audio API 関連 =====
        let audioContext = null;
        let currentSource = null;
        let currentGainNode = null;

        function stopWebAudio() {
            if (currentSource) {
                try {
                    currentSource.stop(0);
                    currentSource.disconnect();
                } catch (e) {}
                currentSource = null;
            }
            if (currentGainNode) {
                try {
                    currentGainNode.disconnect();
                } catch (e) {}
                currentGainNode = null;
            }
        }

        function createNewProgram() {
            const name = prompt('プログラム名を入力してください:', '新規プログラム');
            if (!name) return;

            const sampleRateOptions = ['44100 (CD品質)', '48000 (動画品質)', '22050 (低品質)', '96000 (ハイレゾ)'];
            const sampleRateChoice = prompt(
                'サンプリングレートを選択してください:\n' +
                '1: 44100 Hz (CD品質・標準)\n' +
                '2: 48000 Hz (動画/放送品質)\n' +
                '3: 22050 Hz (低品質・軽量)\n' +
                '4: 96000 Hz (ハイレゾ)',
                '1'
            );

            const sampleRates = { '1': 44100, '2': 48000, '3': 22050, '4': 96000 };
            const sampleRate = sampleRates[sampleRateChoice] || 44100;

            fetch('/api/programs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    stages: [],
                    sample_rate: sampleRate
                })
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = '/program/' + data.id;
            })
            .catch(error => {
                alert('エラーが発生しました: ' + error);
            });
        }

        function deleteProgram(programId) {
            if (!confirm('このプログラムを削除してもよろしいですか？')) return;

            fetch('/api/programs/' + programId, {
                method: 'DELETE'
            })
            .then(() => {
                window.location.reload();
            })
            .catch(error => {
                alert('削除に失敗しました: ' + error);
            });
        }

        function exportProgram(programId, programName) {
            const filename = prompt('ファイル名を入力してください:', programName);
            if (filename === null) return;
            window.location.href = '/api/export/' + programId + '?filename=' + encodeURIComponent(filename);
        }

        function playProgram(programId) {
            fetch(`/api/play/${programId}`, {
                method: 'POST'
            })
            .catch(error => {
                alert('再生エラー: ' + error);
            });
        }

        function stopPlayback() {
            // Web Audio停止
            stopWebAudio();

            // サーバー側も停止
            fetch('/api/stop', {
                method: 'POST'
            })
            .catch(error => {
                alert('停止エラー: ' + error);
            });
        }
    </script>
</body>
</html>
