<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicGenerator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>SonicGenerator <span style="font-size: 14px; opacity: 0.7; font-weight: 400;">v{{ version }}</span></h1>
        </div>
    </header>

    <div class="container">
        <!-- 操作ボタン 1段目 -->
        <div class="toolbar mb-10">
            <button class="btn" onclick="editSelected()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                編集
            </button>
            <button class="btn" onclick="exportSelected()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                WAVE出力
            </button>
            <button class="btn" onclick="copySelected()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                コピー
            </button>
            <button class="btn btn-danger" onclick="deleteSelected()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                削除
            </button>
            <button class="btn btn-success" onclick="createNewProgram()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新規作成
            </button>
            <span class="toolbar-spacer"></span>
            <a href="/wav-player" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
                WAVプレイヤー
            </a>
        </div>

        <!-- 再生コントロール 2段目 -->
        <div class="toolbar mb-20">
            <select id="audio-backend" class="backend-select">
                <option value="webaudio">Web Audio</option>
                <option value="paplay">paplay (Linux)</option>
                <option value="sounddevice">sounddevice</option>
            </select>
            <button class="btn btn-nav" onclick="prevStage()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="19 20 9 12 19 4 19 20"/>
                    <line x1="5" y1="19" x2="5" y2="5"/>
                </svg>
            </button>
            <button class="btn btn-success btn-play" onclick="playSelected()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
            </button>
            <button class="btn btn-danger btn-stop" onclick="stopPlayback()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                </svg>
            </button>
            <button class="btn btn-nav" onclick="nextStage()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 4 15 12 5 20 5 4"/>
                    <line x1="19" y1="5" x2="19" y2="19"/>
                </svg>
            </button>
            <span class="toolbar-spacer"></span>
            <span class="playback-info">
                <span id="playback-status">停止中</span>
                <span id="playback-stage">ステージ: -</span>
                <span id="playback-time">0:00 / 0:00</span>
            </span>
        </div>

        <div id="programs-container">
            {% if programs %}
                <div class="program-list">
                    {% for program in programs %}
                    <div class="program-card" onclick="selectProgram('{{ program.id }}', '{{ program.name }}')" data-program-id="{{ program.id }}">
                        <div class="program-select">
                            <input type="radio" name="selected-program" id="program-{{ program.id }}" value="{{ program.id }}" data-name="{{ program.name }}">
                        </div>
                        <div class="program-info">
                            <h3>{{ program.name }}</h3>
                            <p>
                                ステージ数: {{ program.stages|length }} /
                                サンプリングレート: {{ program.sample_rate }} Hz
                            </p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-state">
                    <p>プログラムがまだありません</p>
                    <button class="btn btn-success" onclick="createNewProgram()">
                        + 新規プログラム作成
                    </button>
                </div>
            {% endif %}
        </div>
    </div>

    <!-- エクスポートモーダル -->
    <div id="export-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; backdrop-filter:blur(4px);">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:linear-gradient(135deg,#1a1a2e,#16213e); border:1px solid rgba(255,255,255,0.15); border-radius:16px; padding:32px; min-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <h3 style="color:#fff; margin:0 0 24px 0; font-size:20px;">WAVE出力</h3>
            <input type="hidden" id="export-program-id">
            <div style="margin-bottom:28px;">
                <label style="display:block; color:#e0e0e0; margin-bottom:8px; font-size:14px;">ファイル名</label>
                <input type="text" id="export-name" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#ffffff; font-size:15px; box-sizing:border-box;" onfocus="this.select()">
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn" onclick="closeExportModal()" style="background:linear-gradient(135deg,#4a5568,#2d3748);">キャンセル</button>
                <button class="btn btn-success" onclick="submitExport()">出力</button>
            </div>
        </div>
    </div>

    <!-- 新規作成モーダル -->
    <div id="create-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; backdrop-filter:blur(4px);">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:linear-gradient(135deg,#1a1a2e,#16213e); border:1px solid rgba(255,255,255,0.15); border-radius:16px; padding:32px; min-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <h3 style="color:#fff; margin:0 0 24px 0; font-size:20px;">新規プログラム作成</h3>
            <div style="margin-bottom:20px;">
                <label style="display:block; color:#e0e0e0; margin-bottom:8px; font-size:14px;">プログラム名</label>
                <input type="text" id="create-name" value="新規プログラム" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#ffffff; font-size:15px; box-sizing:border-box;" onfocus="this.select()">
            </div>
            <div style="margin-bottom:28px;">
                <label style="display:block; color:#e0e0e0; margin-bottom:8px; font-size:14px;">サンプリングレート</label>
                <select id="create-sample-rate" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#ffffff; font-size:15px; cursor:pointer;">
                    <option value="48000" style="background:#1a1a2e; color:#e0e0e0;">48000 Hz（動画/放送品質・標準）</option>
                    <option value="44100" style="background:#1a1a2e; color:#e0e0e0;">44100 Hz（CD品質）</option>
                    <option value="22050" style="background:#1a1a2e; color:#e0e0e0;">22050 Hz（低品質・軽量）</option>
                    <option value="96000" style="background:#1a1a2e; color:#e0e0e0;">96000 Hz（ハイレゾ）</option>
                </select>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn" onclick="closeCreateModal()" style="background:linear-gradient(135deg,#4a5568,#2d3748);">キャンセル</button>
                <button class="btn btn-success" onclick="submitCreateProgram()">作成</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Web Audio API 関連 =====
        let audioContext = null;
        let currentSource = null;
        let currentGainNode = null;
        let webAudioPlaying = false;
        let webAudioStartTime = 0;
        let webAudioDuration = 0;

        function stopWebAudio() {
            if (currentSource) {
                try {
                    currentSource.stop(0);
                    currentSource.disconnect();
                } catch (e) {}
                currentSource = null;
            }
            if (currentGainNode) {
                try {
                    currentGainNode.disconnect();
                } catch (e) {}
                currentGainNode = null;
            }
            webAudioPlaying = false;
        }

        // ===== 選択関連 =====
        function selectProgram(programId, programName) {
            // ラジオボタンを選択
            const radio = document.getElementById('program-' + programId);
            if (radio) radio.checked = true;

            // カードのハイライト
            document.querySelectorAll('.program-card').forEach(card => {
                card.classList.remove('selected');
            });
            const card = document.querySelector(`[data-program-id="${programId}"]`);
            if (card) card.classList.add('selected');

            // 選択を保存
            localStorage.setItem('selectedProgramId', programId);
        }

        function getSelectedProgram() {
            const selected = document.querySelector('input[name="selected-program"]:checked');
            if (!selected) {
                alert('プログラムを選択してください');
                return null;
            }
            return {
                id: selected.value,
                name: selected.dataset.name
            };
        }

        function editSelected() {
            const program = getSelectedProgram();
            if (program) {
                window.location.href = '/program/' + program.id;
            }
        }

        function playSelected() {
            const program = getSelectedProgram();
            if (!program) return;

            const backend = document.getElementById('audio-backend').value;

            if (backend === 'webaudio') {
                // Web Audio APIで再生
                playWithWebAudio(program.id);
            } else {
                // サーバーサイドで再生
                fetch(`/api/play/${program.id}?backend=${backend}`, {
                    method: 'POST'
                })
                .catch(error => {
                    alert('再生エラー: ' + error);
                });
            }
        }

        function playWithWebAudio(programId) {
            // 波形データを取得してWeb Audioで再生
            fetch(`/api/waveform/data/program/${programId}`)
                .then(response => response.json())
                .then(data => {
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    stopWebAudio();

                    const audioBuffer = audioContext.createBuffer(1, data.waveform.length, data.sample_rate);
                    const channelData = audioBuffer.getChannelData(0);
                    for (let i = 0; i < data.waveform.length; i++) {
                        channelData[i] = data.waveform[i];
                    }

                    currentSource = audioContext.createBufferSource();
                    currentGainNode = audioContext.createGain();

                    currentSource.buffer = audioBuffer;
                    currentSource.connect(currentGainNode);
                    currentGainNode.connect(audioContext.destination);

                    // 再生状態を追跡
                    webAudioPlaying = true;
                    webAudioStartTime = audioContext.currentTime;
                    webAudioDuration = data.duration;

                    currentSource.onended = function() {
                        webAudioPlaying = false;
                    };

                    currentSource.start(0);
                })
                .catch(error => {
                    alert('Web Audio再生エラー: ' + error);
                });
        }

        function exportSelected() {
            const program = getSelectedProgram();
            if (program) {
                document.getElementById('export-name').value = program.name;
                document.getElementById('export-program-id').value = program.id;
                document.getElementById('export-modal').style.display = 'block';
                document.getElementById('export-name').focus();
            }
        }

        function closeExportModal() {
            document.getElementById('export-modal').style.display = 'none';
        }

        function submitExport() {
            const filename = document.getElementById('export-name').value.trim();
            const programId = document.getElementById('export-program-id').value;
            if (!filename) {
                document.getElementById('export-name').focus();
                return;
            }
            closeExportModal();
            window.location.href = '/api/export/' + programId + '?filename=' + encodeURIComponent(filename);
        }

        function copySelected() {
            const program = getSelectedProgram();
            if (!program) return;

            fetch(`/api/programs/${program.id}/copy`, {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) throw new Error('コピーに失敗しました');
                return response.json();
            })
            .then(data => {
                window.location.reload();
            })
            .catch(error => {
                alert('エラーが発生しました: ' + error);
            });
        }

        function deleteSelected() {
            const program = getSelectedProgram();
            if (!program) return;
            if (!confirm(`"${program.name}" を削除してもよろしいですか？`)) return;

            fetch('/api/programs/' + program.id, {
                method: 'DELETE'
            })
            .then(() => {
                window.location.reload();
            })
            .catch(error => {
                alert('削除に失敗しました: ' + error);
            });
        }

        function createNewProgram() {
            document.getElementById('create-modal').style.display = 'block';
            document.getElementById('create-name').focus();
        }

        function closeCreateModal() {
            document.getElementById('create-modal').style.display = 'none';
        }

        function submitCreateProgram() {
            const name = document.getElementById('create-name').value.trim();
            if (!name) {
                document.getElementById('create-name').focus();
                return;
            }
            const sampleRate = parseInt(document.getElementById('create-sample-rate').value);

            fetch('/api/programs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    stages: [],
                    sample_rate: sampleRate
                })
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = '/program/' + data.id;
            })
            .catch(error => {
                alert('エラーが発生しました: ' + error);
            });
        }

        // モーダル外クリックで閉じる
        document.getElementById('create-modal').addEventListener('click', function(e) {
            if (e.target === this) closeCreateModal();
        });
        document.getElementById('export-modal').addEventListener('click', function(e) {
            if (e.target === this) closeExportModal();
        });

        // Enterキーで実行
        document.getElementById('create-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitCreateProgram();
        });
        document.getElementById('export-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitExport();
        });

        // Escキーでモーダルを閉じる
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('create-modal').style.display === 'block') closeCreateModal();
                if (document.getElementById('export-modal').style.display === 'block') closeExportModal();
            }
        });

        function stopPlayback() {
            stopWebAudio();
            updateStatus('停止中');
            fetch('/api/stop', {
                method: 'POST'
            })
            .catch(error => {
                alert('停止エラー: ' + error);
            });
        }

        function prevStage() {
            fetch('/api/prev', {
                method: 'POST'
            })
            .catch(error => {
                alert('ステージ移動エラー: ' + error);
            });
        }

        function nextStage() {
            fetch('/api/next', {
                method: 'POST'
            })
            .catch(error => {
                alert('ステージ移動エラー: ' + error);
            });
        }

        function updateStatus(text) {
            const status = document.getElementById('playback-status');
            if (status) status.textContent = text;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function pollStatus() {
            const statusEl = document.getElementById('playback-status');
            const stageEl = document.getElementById('playback-stage');
            const timeEl = document.getElementById('playback-time');

            // Web Audio再生中はクライアント側の情報を使う
            if (webAudioPlaying && audioContext) {
                const elapsed = audioContext.currentTime - webAudioStartTime;
                statusEl.textContent = '再生中';
                statusEl.classList.add('playing');
                stageEl.textContent = 'ステージ: 1';
                timeEl.textContent = `${formatTime(elapsed)} / ${formatTime(webAudioDuration)}`;
                return;
            }

            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    statusEl.classList.remove('playing');

                    if (data.is_playing) {
                        statusEl.textContent = '再生中';
                        statusEl.classList.add('playing');
                    } else {
                        statusEl.textContent = '停止中';
                    }

                    stageEl.textContent = `ステージ: ${data.current_stage + 1}`;
                    timeEl.textContent = `${formatTime(data.elapsed_time)} / ${formatTime(data.total_time)}`;
                })
                .catch(() => {});
        }

        // 1秒ごとにステータスを更新
        setInterval(pollStatus, 1000);
        pollStatus();

        // ページ読み込み時に前の選択を復元
        document.addEventListener('DOMContentLoaded', function() {
            const savedProgramId = localStorage.getItem('selectedProgramId');
            if (savedProgramId) {
                const radio = document.getElementById('program-' + savedProgramId);
                if (radio) {
                    radio.checked = true;
                    const card = document.querySelector(`[data-program-id="${savedProgramId}"]`);
                    if (card) card.classList.add('selected');
                }
            }
        });
    </script>
</body>
</html>
